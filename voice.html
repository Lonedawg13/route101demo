<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice button test</title>
<style>
body{font-family:Arial,sans-serif;background:#071638;color:#fff;padding:40px}
#testVoiceButton{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:12px;padding:16px 22px;background:#2563eb;color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.25)}
#status{margin-top:16px;color:#cbd5e1}
</style>
</head>
<body>
<h1>Voice control test</h1>
<button id="testVoiceButton" type="button">🎙 Talk to Henry-James</button>
<p id="status">Button is visible. No Cognigy call API is attached to it.</p>

<script src="https://github.com/Cognigy/click-to-call-widget/releases/latest/download/webRTCWidget.js"></script>
<script>
addEventListener("load", (event) => {if (window.initWebRTCWidget) {window.initWebRTCWidget("wss://endpoint-trial.cognigy.ai/f335f5191395b6067dc946f94f044b9d45d1b183bc4b63352115ec0895220072/voiceGateway")}});

document.getElementById("testVoiceButton").addEventListener("click", () => {
  document.getElementById("status").textContent = "Test button clicked successfully. It deliberately does not call any undocumented Cognigy API.";
});
</script>
</body>
</html>
